<!-

Google Charts

World cup example

Autor: P. Dias

Data: July 2018

->
<html>
<head>
    <!--Load the AJAX API-->
    <meta charset="utf-8"/>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    
    <!--Load jquery and jquery.csv to load csv file-->
    <script src="http://code.jquery.com/jquery-1.10.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/0.8.3/jquery.csv.min.js"></script>    

    <script type="text/javascript">

    // Load the Visualization API and the corechart package.
    google.charts.load('current', {'packages':['corechart']});

    // Set a callback to run when the Google Visualization API is loaded.
    google.charts.setOnLoadCallback(drawChart);
    
    // Callback that creates and populates a data table, 
    // instantiates the pie chart, passes in the data and
    // draws it.
    function drawChart() {
        
        // grab the CSV
        $.get("world_cup.csv", function(csvString) {
            // transform the CSV string into a 2-dimensional array
            var arrayData = $.csv.toArrays(csvString, {onParseValue: $.csv.hooks.castToScalar});

            // this new DataTable object holds all the data
            var data = new google.visualization.arrayToDataTable(arrayData);

            // Group by year (column 8), summing attendance (column 0) for
            // each year. The result has two columns: year, total attendance.
            var result = google.visualization.data.group(
                data,
                [8],
                [{'column': 0, 'aggregation' : google.visualization.data.sum, 'type' : 'number'}]
            );

            // Extra column: null everywhere except the year the tournament
            // resumed after WWII (1950), so it renders as its own series
            // with a single, distinctly-styled marker at that point.
            result.insertColumn(2, 'number', 'WWII gap');
            for (var i = 0; i < result.getNumberOfRows(); i++) {
                var year = result.getValue(i, 0);
                result.setValue(i, 2, (1939 <= year <= 1945) ? result.getValue(i, 1) : null);
            }

            // set chart options
            var options = {
                title: "World cup attendance",
                hAxis: {title: "year"},
                vAxis: {title: "attendance"},
                pointsVisible: true,
                pointSize: 5,
                series: {
                    0: {pointSize: 5},
                    1: {lineWidth: 0, pointSize: 14, pointShape: 'star', color: 'red'}
                }
            };

            // create the chart object and draw it
            var chart = new google.visualization.LineChart(document.getElementById('id_chart'));
            chart.draw(result, options);
        });
    }
    </script>

</head>
<body style="font-family: Arial;border: 0 none;">
    <div id="id_chart" style="width: 600px; height: 400px;"></div>
</body>
</html>
