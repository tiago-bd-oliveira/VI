// Reads the embedded workbook and turns its first sheet into a
// google.visualization.DataTable, dropping the trailing footnote column.
function buildDataTableFromXlsx( base64 )
{
	var workbook = XLSX.read( base64, { type: 'base64' } );
	var sheet = workbook.Sheets[ workbook.SheetNames[0] ];
	var rows = XLSX.utils.sheet_to_json( sheet, { header: 1, defval: null } );

	rows[0][0] = 'Year';                                 // the sheet leaves this header cell blank
	rows.slice(1).forEach( row => row[0] = String( row[0] ) );

	return google.visualization.arrayToDataTable(
		rows.map( row => row.slice( 0, 6 ) )
	);
} 

function drawChart( )
{

	var data = buildDataTableFromXlsx( XLSX_BASE64 );

	var options = {
			title : 'UA - DETI - Candidates by course and year',
			width : 900,
			height : 600,
			vAxis: {viewWindow: { min: 0 }},
            seriesType: 'bars',
            series: {4: {type: 'line'}}
	};


	var chart = new google.visualization.ComboChart(
		document.getElementById('column_chart_div')
	)

	chart.draw(data, options);

}
